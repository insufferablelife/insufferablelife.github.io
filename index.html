<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #171717;
    }

    canvas {
      display: block;
      width: min(800px, 100vw);
      height: auto;
      background: #000000;
    }

    .audio-status {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      left: 1rem;
      margin: 0;
      color: #ffffff;
      font: 14px/1.4 system-ui, sans-serif;
      text-align: center;
    }

    .audio-status button {
      margin-left: 0.5rem;
    }

  </style>
</head>
<body>
  <main>
    <canvas id="game" width="800" height="600" aria-label="Space Invaders game. Use left and right arrows to move, up and down during the boss fight, and hold Space to fire.">
      Your browser does not support the HTML canvas element.
    </canvas>
    <div id="audioStatus" class="audio-status" role="status" hidden>
      <span></span>
      <button id="retryAudio" type="button" hidden>Retry Music</button>
    </div>
  </main>

  <audio
    id="bossMusic"
    src="https://dn720302.ca.archive.org/0/items/07-one-last-trial/crosscode_ost_ex_flac/02-Boss%20Rush.mp3"
    preload="none"
    loop
  ></audio>

  <script>
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const audioStatus = document.getElementById("audioStatus");
    const retryAudio = document.getElementById("retryAudio");
    const bossMusic = document.getElementById("bossMusic");
    const rushMusicUrl = bossMusic.src;
    const bigZimThemeUrl =
      "https://dn721906.ca.archive.org/0/items/touhou-15-original-soundtrack/11.%20Pierrot%20of%20the%20Star-Spangled%20Banner.mp3";
    const playerDeathSoundUrl = "https://www.myinstants.com/media/sounds/pichuun.mp3";
    const gameOverSoundUrl =
      "https://www.myinstants.com/media/sounds/dark-souls-you-died-sound-effect_hm5sYFG.mp3";
    const bossDeathSoundUrl =
      "https://www.myinstants.com/media/sounds/touhou-boss-death-sfx.mp3";
    const victorySoundUrl = "https://www.myinstants.com/media/sounds/win31.mp3";
    const rewindSoundUrl = "https://www.myinstants.com/media/sounds/rewind-fail-fx.mp3";
    const playerBaseWidth = 42;
    const playerBaseHeight = 28;
    const konamiSequence = [
      "ArrowUp",
      "ArrowUp",
      "ArrowDown",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      "ArrowLeft",
      "ArrowRight",
      "KeyB",
      "KeyA"
    ];

    const bunkerMask = [
      "000001111110000000",
      "000111111111000000",
      "001111111111110000",
      "011111111111111000",
      "111111111111111111",
      "111111111111111111",
      "111111111111111111",
      "111111000011111111",
      "111110000001111111",
      "111110000001111111"
    ];

    const spriteTypes = {
      squid: {
        color: "#00e5ff",
        score: 30,
        frames: [
          [
            "00000100000",
            "00001110000",
            "00011111000",
            "00110101100",
            "01111111110",
            "01011111010",
            "00011011000",
            "00110001100"
          ],
          [
            "00000100000",
            "00001110000",
            "00011111000",
            "00110101100",
            "01111111110",
            "01011111010",
            "00110001100",
            "00011011000"
          ]
        ]
      },
      crab: {
        color: "#ff35c5",
        score: 20,
        frames: [
          [
            "00001110000",
            "00111111100",
            "01101110110",
            "11111111111",
            "11011111011",
            "10010001001",
            "00100100100",
            "01000000010"
          ],
          [
            "00001110000",
            "00111111100",
            "01101110110",
            "11111111111",
            "11011111011",
            "00100100100",
            "01000000010",
            "10000000001"
          ]
        ]
      },
      octopus: {
        color: "#ffe600",
        score: 10,
        frames: [
          [
            "00011111000",
            "01111111110",
            "11101110111",
            "11111111111",
            "00111011100",
            "01100100110",
            "11000000011",
            "10000000001"
          ],
          [
            "00011111000",
            "01111111110",
            "11101110111",
            "11111111111",
            "00111011100",
            "00100100100",
            "01100000110",
            "11000000011"
          ]
        ]
      }
    };

    const bigZimSprite = [
      "00000011111111000000",
      "00001111111111110000",
      "00011111111111111000",
      "00111121111121111100",
      "01111111111111111110",
      "11111111111111111111",
      "11100111111111100111",
      "11000111111111100011",
      "00000111111111100000",
      "00011111111111111100",
      "00111111111111111100",
      "01111111111111111110",
      "11111111111111111111",
      "11110111111111101111",
      "11100111111111100111",
      "00001100000000110000",
      "00011000000000011000",
      "00110000000000001100",
      "01100000000000000110",
      "11000000000000000011"
    ];

    const player = {
      x: (canvas.width - playerBaseWidth) / 2,
      y: canvas.height - 54,
      width: playerBaseWidth,
      height: playerBaseHeight,
      speed: 360,
      fireCooldown: 0,
      invulnerableUntil: 0,
      flashUntil: 0,
      flashStartedAt: 0,
      respawning: false,
      respawnAt: 0
    };

    const keys = {
      left: false,
      right: false,
      up: false,
      down: false,
      fire: false
    };

    const formation = {
      offsetX: 0,
      offsetY: 0,
      direction: 1,
      speed: 42,
      dropDistance: 18,
      startX: 95,
      startY: 82,
      spacingX: 58,
      spacingY: 46,
      spritePixelSize: 3
    };

    const invaders = [];
    for (let row = 0; row < 5; row += 1) {
      for (let column = 0; column < 11; column += 1) {
        const type = row === 0 ? "squid" : row <= 2 ? "crab" : "octopus";
        invaders.push({
          row,
          column,
          baseX: formation.startX + column * formation.spacingX,
          baseY: formation.startY + row * formation.spacingY,
          width: 33,
          height: 24,
          type,
          alive: true
        });
      }
    }

    const bunkerCellSize = 4;
    const bunkers = [70, 270, 470, 670].map((x) => ({
      x,
      y: 420,
      cellSize: bunkerCellSize,
      cells: bunkerMask.map((row) => Array.from(row, (cell) => cell === "1"))
    }));

    const playerBullets = [];
    const enemyBullets = [];

    const game = {
      score: 0,
      lives: 3,
      destroyedInvaders: 0,
      time: 0,
      enemyFireCooldown: 1.5,
      phase: "standard",
      rushAlertUntil: 0,
      intermissionUntil: 0,
      bossAlertUntil: 0,
      gameOver: false,
      victory: false,
      victoryPending: false,
      devMode: false
    };

    const boss = {
      x: 0,
      y: 82,
      width: 200,
      height: 200,
      health: 420,
      maxHealth: 420,
      startedAt: 0,
      pattern: 0,
      attackCooldown: 0
    };

    function livingInvaders() {
      return invaders.filter((invader) => invader.alive);
    }

    let audioContext = null;
    let masterGain = null;
    let noiseBuffer = null;
    let soundErrorReported = false;
    let konamiIndex = 0;
    const activeAudioCues = new Set();

    function reportSoundError(error) {
      if (soundErrorReported) {
        return;
      }

      soundErrorReported = true;
      console.error("Web Audio sound effects could not be played.", error);
      audioStatus.querySelector("span").textContent =
        "Sound effects are unavailable in this browser.";
      audioStatus.hidden = false;
    }

    function getAudioContext() {
      const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextConstructor) {
        reportSoundError(new Error("Web Audio API is not supported."));
        return null;
      }

      if (!audioContext) {
        try {
          audioContext = new AudioContextConstructor();
          masterGain = audioContext.createGain();
          masterGain.gain.value = 0.28;
          masterGain.connect(audioContext.destination);

          noiseBuffer = audioContext.createBuffer(
            1,
            Math.floor(audioContext.sampleRate * 0.75),
            audioContext.sampleRate
          );
          const noiseSamples = noiseBuffer.getChannelData(0);
          for (let sample = 0; sample < noiseSamples.length; sample += 1) {
            noiseSamples[sample] = Math.random() * 2 - 1;
          }
        } catch (error) {
          audioContext = null;
          reportSoundError(error);
          return null;
        }
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(reportSoundError);
      }
      return audioContext;
    }

    function playTone(audio, type, startFrequency, endFrequency, startTime, duration, volume) {
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(startFrequency, startTime);
      oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(1, endFrequency),
        startTime + duration
      );
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      oscillator.connect(gain);
      gain.connect(masterGain);
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.01);
    }

    function playNoise(audio, startTime, duration, volume, startFrequency, endFrequency) {
      const source = audio.createBufferSource();
      const filter = audio.createBiquadFilter();
      const gain = audio.createGain();
      source.buffer = noiseBuffer;
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(startFrequency, startTime);
      filter.frequency.exponentialRampToValueAtTime(endFrequency, startTime + duration);
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      source.start(startTime);
      source.stop(startTime + duration + 0.01);
    }

    function playLaserSound() {
      const audio = getAudioContext();
      if (!audio) {
        return;
      }
      playTone(audio, "square", 1050, 260, audio.currentTime, 0.12, 0.16);
    }

    function playEnemyShotSound() {
      const audio = getAudioContext();
      if (!audio) {
        return;
      }
      playTone(audio, "sawtooth", 460, 110, audio.currentTime, 0.16, 0.07);
    }

    function playExplosionSound() {
      const audio = getAudioContext();
      if (!audio) {
        return;
      }

      const startTime = audio.currentTime;
      playTone(audio, "sine", 170, 36, startTime, 0.48, 0.3);
      playTone(audio, "triangle", 760, 105, startTime + 0.012, 0.34, 0.1);
      playTone(audio, "square", 330, 58, startTime + 0.025, 0.26, 0.055);
      playNoise(audio, startTime, 0.42, 0.24, 7200, 240);
    }

    function playImpactSound() {
      const audio = getAudioContext();
      if (!audio) {
        return;
      }

      const startTime = audio.currentTime;
      playTone(audio, "triangle", 280, 90, startTime, 0.08, 0.1);
      playNoise(audio, startTime, 0.09, 0.1, 2600, 420);
    }

    let currentAudioUrl = rushMusicUrl;

    function reportAudioError(error) {
      console.error("Game audio could not be played.", error);
      audioStatus.querySelector("span").textContent =
        "Game audio could not be played. Check your connection or audio permissions.";
      audioStatus.hidden = false;
      retryAudio.hidden = false;
    }

    function reportAudioCueError(error) {
      console.error("A sound effect could not be played.", error);
      audioStatus.querySelector("span").textContent =
        "A sound effect could not be played. Check your connection or audio permissions.";
      audioStatus.hidden = false;
    }

    function playGameAudio(url, loop) {
      currentAudioUrl = url;
      bossMusic.src = url;
      bossMusic.loop = loop;
      bossMusic.play().then(() => {
        audioStatus.hidden = true;
        retryAudio.hidden = true;
      }).catch(reportAudioError);
    }

    function retryGameAudio() {
      if (game.gameOver) {
        return;
      }
      playGameAudio(
        currentAudioUrl,
        !game.victory && (game.phase === "rush" || game.phase === "boss")
      );
    }

    bossMusic.addEventListener("error", () => {
      reportAudioError(new Error("The game audio file could not be loaded."));
    });

    retryAudio.addEventListener("click", retryGameAudio);

    function playAudioCue(url) {
      return new Promise((resolve) => {
        let cue;
        try {
          cue = new Audio(url);
        } catch (error) {
          reportAudioCueError(error);
          resolve();
          return;
        }
        activeAudioCues.add(cue);
        const finish = () => {
          activeAudioCues.delete(cue);
          resolve();
        };
        cue.addEventListener("ended", finish, { once: true });
        cue.addEventListener("error", () => {
          reportAudioCueError(new Error(`The audio file could not be loaded: ${url}`));
          finish();
        }, { once: true });
        try {
          cue.play().catch((error) => {
            reportAudioCueError(error);
            finish();
          });
        } catch (error) {
          reportAudioCueError(error);
          finish();
        }
      });
    }

    function stopAudioCues() {
      for (const cue of activeAudioCues) {
        cue.pause();
        cue.currentTime = 0;
      }
      activeAudioCues.clear();
    }

    function startRushMode() {
      if (game.phase !== "standard") {
        return;
      }

      game.phase = "rush";
      game.rushAlertUntil = game.time + 3;
      game.enemyFireCooldown = 0.3;
      playGameAudio(rushMusicUrl, true);
    }

    function beginBossIntermission() {
      if (game.phase !== "rush") {
        return;
      }

      game.phase = "intermission";
      game.intermissionUntil = game.time + 2;
      bossMusic.pause();
      playAudioCue(rewindSoundUrl);
    }

    function startBossBattle() {
      game.phase = "boss";
      game.bossAlertUntil = game.time + 5;
      game.lives = 5;
      game.enemyFireCooldown = 0;
      boss.health = boss.maxHealth;
      boss.startedAt = game.time;
      boss.pattern = 0;
      boss.attackCooldown = 0.5;
      boss.x = (canvas.width - boss.width) / 2;
      player.width = playerBaseWidth / 2.5;
      player.height = playerBaseHeight / 2.5;
      player.x = (canvas.width - player.width) / 2;
      player.y = canvas.height - 54;
      player.invulnerableUntil = Math.max(player.invulnerableUntil, game.time + 1.5);
      enemyBullets.length = 0;
      playerBullets.length = 0;
      playGameAudio(bigZimThemeUrl, true);
    }

    function endGame(won) {
      if (game.gameOver || game.victory || game.victoryPending) {
        return;
      }

      bossMusic.pause();
      if (won) {
        game.victoryPending = true;
        playAudioCue(bossDeathSoundUrl).then(() => {
          if (!game.victoryPending) {
            return;
          }
          game.victoryPending = false;
          game.victory = true;
          playAudioCue(victorySoundUrl);
        });
      } else {
        game.gameOver = true;
        playAudioCue(gameOverSoundUrl);
      }
    }

    function resetGame() {
      bossMusic.pause();
      stopAudioCues();
      bossMusic.currentTime = 0;
      bossMusic.src = rushMusicUrl;
      bossMusic.loop = true;
      currentAudioUrl = rushMusicUrl;
      audioStatus.hidden = true;
      retryAudio.hidden = true;
      audioStatus.querySelector("span").textContent = "";

      Object.assign(game, {
        score: 0,
        lives: 3,
        destroyedInvaders: 0,
        time: 0,
        enemyFireCooldown: 1.5,
        phase: "standard",
        rushAlertUntil: 0,
        intermissionUntil: 0,
        bossAlertUntil: 0,
        gameOver: false,
        victory: false,
        victoryPending: false,
        devMode: false
      });
      Object.assign(player, {
        x: (canvas.width - playerBaseWidth) / 2,
        y: canvas.height - 54,
        width: playerBaseWidth,
        height: playerBaseHeight,
        fireCooldown: 0,
        invulnerableUntil: 0,
        flashUntil: 0,
        flashStartedAt: 0,
        respawning: false,
        respawnAt: 0
      });
      Object.assign(formation, {
        offsetX: 0,
        offsetY: 0,
        direction: 1
      });
      Object.assign(boss, {
        x: 0,
        health: boss.maxHealth,
        startedAt: 0,
        pattern: 0,
        attackCooldown: 0
      });
      for (const invader of invaders) {
        invader.alive = true;
      }
      for (const bunker of bunkers) {
        bunker.cells = bunkerMask.map((row) => Array.from(row, (cell) => cell === "1"));
      }
      playerBullets.length = 0;
      enemyBullets.length = 0;
      konamiIndex = 0;
      keys.left = false;
      keys.right = false;
      keys.up = false;
      keys.down = false;
      keys.fire = false;
    }

    function movePlayer(deltaTime) {
      if (player.respawning) {
        return;
      }
      const direction = Number(keys.right) - Number(keys.left);
      player.x += direction * player.speed * deltaTime;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      if (game.phase === "boss") {
        const verticalDirection = Number(keys.down) - Number(keys.up);
        player.y += verticalDirection * player.speed * deltaTime;
        const minimumY = boss.y + boss.height + 20;
        player.y = Math.max(minimumY, Math.min(canvas.height - player.height - 10, player.y));
      }

      player.fireCooldown -= deltaTime;
      const fireInterval = game.phase === "rush" || game.phase === "boss" ? 0.1 : 0.35;
      if (keys.fire && player.fireCooldown <= 0) {
        playerBullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y - 14,
          width: 4,
          height: 14,
          speed: 520
        });
        playLaserSound();
        player.fireCooldown = fireInterval;
      }
    }

    function moveFormation(deltaTime) {
      const activeInvaders = livingInvaders();
      if (activeInvaders.length === 0) {
        return;
      }

      let leftEdge = Infinity;
      let rightEdge = -Infinity;
      for (const invader of activeInvaders) {
        leftEdge = Math.min(leftEdge, invader.baseX + formation.offsetX);
        rightEdge = Math.max(rightEdge, invader.baseX + formation.offsetX + invader.width);
      }

      const speedMultiplier = game.phase === "rush" ? 2 : 1;
      const nextOffsetX = formation.offsetX +
        formation.direction * formation.speed * speedMultiplier * deltaTime;
      const horizontalStep = nextOffsetX - formation.offsetX;

      if (leftEdge + horizontalStep <= 0) {
        const leftmostBase = Math.min(...activeInvaders.map((invader) => invader.baseX));
        formation.offsetX = -leftmostBase;
        formation.direction = 1;
        formation.offsetY += formation.dropDistance;
      } else if (rightEdge + horizontalStep >= canvas.width) {
        const rightmostBase = Math.max(...activeInvaders.map((invader) => invader.baseX + invader.width));
        formation.offsetX = canvas.width - rightmostBase;
        formation.direction = -1;
        formation.offsetY += formation.dropDistance;
      } else {
        formation.offsetX = nextOffsetX;
      }

      const reachedPlayer = activeInvaders.some(
        (invader) => invader.baseY + formation.offsetY + invader.height >= player.y
      );
      if (reachedPlayer) {
        endGame(false);
      }
    }

    function fireEnemyBullet() {
      const bottomInvaderByColumn = new Map();
      for (const invader of livingInvaders()) {
        const current = bottomInvaderByColumn.get(invader.column);
        if (!current || invader.row > current.row) {
          bottomInvaderByColumn.set(invader.column, invader);
        }
      }

      const shooters = Array.from(bottomInvaderByColumn.values());
      if (shooters.length === 0) {
        return;
      }

      const shooter = shooters[Math.floor(Math.random() * shooters.length)];
      enemyBullets.push({
        x: shooter.baseX + formation.offsetX + shooter.width / 2 - 2,
        y: shooter.baseY + formation.offsetY + shooter.height,
        width: 4,
        height: 12,
        speed: 220
      });
      playEnemyShotSound();
    }

    function fireBossBullet(x, y, velocityX, velocityY, options) {
      enemyBullets.push({
        x,
        y,
        width: options.width || 8,
        height: options.height || 8,
        vx: velocityX,
        vy: velocityY,
        curveAmplitude: options.curveAmplitude || 0,
        curveSpeed: options.curveSpeed || 0,
        curvePhase: options.curvePhase || 0
      });
    }

    function fireBossRings() {
      const centerX = boss.x + boss.width / 2;
      const centerY = boss.y + boss.height - 4;
      const bulletCount = 32;
      for (let ring = 0; ring < 3; ring += 1) {
        for (let index = 0; index < bulletCount; index += 1) {
          if (index >= 14 && index <= 17) {
            continue;
          }
          const angle = Math.PI * 2 * index / bulletCount;
          const speed = 105 + ring * 48;
          fireBossBullet(
            centerX - 4,
            centerY,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            { width: 8, height: 8 }
          );
        }
      }
    }

    function fireBossCurtain() {
      const columns = 10;
      const spacing = canvas.width / (columns + 1);
      for (let column = 1; column <= columns; column += 1) {
        const x = column * spacing;
        const phase = game.time * 2.2 + column * 0.75;
        fireBossBullet(
          x - 4,
          boss.y + boss.height - 4,
          0,
          190,
          {
            width: 9,
            height: 11,
            curveAmplitude: 115,
            curveSpeed: 2.4,
            curvePhase: phase
          }
        );
        fireBossBullet(
          canvas.width - x - 4,
          boss.y + boss.height - 4,
          0,
          190,
          {
            width: 9,
            height: 11,
            curveAmplitude: 115,
            curveSpeed: 2.4,
            curvePhase: phase + Math.PI
          }
        );
      }
    }

    function fireBossStarSpray() {
      const centerX = boss.x + boss.width / 2;
      const centerY = boss.y + boss.height - 4;
      const bulletCount = 36;
      for (let index = 0; index < bulletCount; index += 1) {
        if (index % 12 >= 8 && index % 12 <= 9) {
          continue;
        }
        const angle = Math.PI * 2 * index / bulletCount + Math.PI / 36;
        const speed = index % 2 === 0 ? 205 : 145;
        fireBossBullet(
          centerX - 5,
          centerY,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          { width: 10, height: 10 }
        );
      }
    }

    function updateBoss(deltaTime) {
      const elapsed = game.time - boss.startedAt;
      boss.x = (canvas.width - boss.width) / 2 + Math.sin(elapsed * 0.62) * 245;
      const nextPattern = Math.floor(elapsed / 5) % 3;
      if (nextPattern !== boss.pattern) {
        boss.pattern = nextPattern;
        boss.attackCooldown = 0.35;
      }

      boss.attackCooldown -= deltaTime;
      if (boss.attackCooldown > 0) {
        return;
      }

      if (boss.pattern === 0) {
        fireBossRings();
        boss.attackCooldown = 1.35;
      } else if (boss.pattern === 1) {
        fireBossCurtain();
        boss.attackCooldown = 0.32;
      } else {
        fireBossStarSpray();
        boss.attackCooldown = 0.95;
      }
    }

    function overlaps(first, second) {
      return first.x < second.x + second.width &&
        first.x + first.width > second.x &&
        first.y < second.y + second.height &&
        first.y + first.height > second.y;
    }

    function erodeBunker(bunker, hitRow, hitColumn) {
      for (let row = hitRow - 1; row <= hitRow + 1; row += 1) {
        for (let column = hitColumn - 1; column <= hitColumn + 1; column += 1) {
          if (
            row >= 0 &&
            row < bunker.cells.length &&
            column >= 0 &&
            column < bunker.cells[row].length
          ) {
            bunker.cells[row][column] = false;
          }
        }
      }
    }

    function collideWithBunker(bullet, previousY) {
      const sampleStep = bunkerCellSize / 2;
      const startCenterY = previousY + bullet.height / 2;
      const endCenterY = bullet.y + bullet.height / 2;
      const sampleCount = Math.max(1, Math.ceil(Math.abs(endCenterY - startCenterY) / sampleStep));

      for (const bunker of bunkers) {
        const firstColumn = Math.floor((bullet.x - bunker.x) / bunker.cellSize);
        const lastColumn = Math.floor((bullet.x + bullet.width - 0.01 - bunker.x) / bunker.cellSize);
        if (lastColumn < 0 || firstColumn >= bunker.cells[0].length) {
          continue;
        }

        for (let sample = 0; sample <= sampleCount; sample += 1) {
          const sampleY = startCenterY + (endCenterY - startCenterY) * sample / sampleCount;
          const firstRow = Math.floor((sampleY - bullet.height / 2 - bunker.y) / bunker.cellSize);
          const lastRow = Math.floor(
            (sampleY + bullet.height / 2 - 0.01 - bunker.y) / bunker.cellSize
          );
          for (let row = firstRow; row <= lastRow; row += 1) {
            if (row < 0 || row >= bunker.cells.length) {
              continue;
            }
            for (
              let column = Math.max(0, firstColumn);
              column <= Math.min(bunker.cells[row].length - 1, lastColumn);
              column += 1
            ) {
              if (bunker.cells[row][column]) {
                erodeBunker(bunker, row, column);
                playImpactSound();
                return true;
              }
            }
          }
        }
      }

      return false;
    }

    function updateBullets(deltaTime) {
      for (let bulletIndex = playerBullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
        const bullet = playerBullets[bulletIndex];
        const previousY = bullet.y;
        bullet.y -= bullet.speed * deltaTime;
        if (collideWithBunker(bullet, previousY)) {
          playerBullets.splice(bulletIndex, 1);
          continue;
        }
        if (bullet.y + bullet.height < 0) {
          playerBullets.splice(bulletIndex, 1);
          continue;
        }

        if (
          game.phase === "boss" &&
          overlaps(bullet, {
            x: boss.x + 8,
            y: boss.y + 8,
            width: boss.width - 16,
            height: boss.height - 16
          })
        ) {
          boss.health = Math.max(0, boss.health - 4);
          game.score += 10;
          playerBullets.splice(bulletIndex, 1);
          playImpactSound();
          if (boss.health === 0) {
            endGame(true);
            return;
          }
          continue;
        }

        const hit = invaders.find((invader) => {
          if (!invader.alive) {
            return false;
          }
          return overlaps(bullet, {
            x: invader.baseX + formation.offsetX,
            y: invader.baseY + formation.offsetY,
            width: invader.width,
            height: invader.height
          });
        });

        if (hit) {
          hit.alive = false;
          game.score += spriteTypes[hit.type].score;
          game.destroyedInvaders += 1;
          playerBullets.splice(bulletIndex, 1);
          playExplosionSound();
          if (game.phase === "standard" && game.destroyedInvaders === 5) {
            startRushMode();
          }
        }
      }

      for (let bulletIndex = enemyBullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
        const bullet = enemyBullets[bulletIndex];
        const previousY = bullet.y;
        bullet.x += (bullet.vx || 0) * deltaTime;
        if (bullet.curveAmplitude) {
          bullet.x += Math.sin(game.time * bullet.curveSpeed + bullet.curvePhase) *
            bullet.curveAmplitude * deltaTime;
        }
        bullet.y += (bullet.vy === undefined ? bullet.speed : bullet.vy) * deltaTime;
        if (collideWithBunker(bullet, previousY)) {
          enemyBullets.splice(bulletIndex, 1);
          continue;
        }
        if (
          bullet.y + bullet.height < 0 ||
          bullet.y > canvas.height ||
          bullet.x + bullet.width < 0 ||
          bullet.x > canvas.width
        ) {
          enemyBullets.splice(bulletIndex, 1);
          continue;
        }

        if (!player.respawning && overlaps(bullet, player)) {
          enemyBullets.splice(bulletIndex, 1);
          if (!game.devMode && game.time >= player.invulnerableUntil) {
            game.lives -= 1;
            playAudioCue(playerDeathSoundUrl);
            if (game.lives <= 0) {
              endGame(false);
            } else {
              player.respawning = true;
              player.respawnAt = game.time + 1;
            }
          }
        }
      }
    }

    function update(deltaTime) {
      game.time += deltaTime;
      if (game.gameOver || game.victory || game.victoryPending) {
        return;
      }

      if (player.respawning && game.time >= player.respawnAt) {
        player.respawning = false;
        player.x = (canvas.width - player.width) / 2;
        if (game.phase !== "boss") {
          player.y = canvas.height - 54;
        }
        player.invulnerableUntil = game.time + 5;
        player.flashStartedAt = game.time;
        player.flashUntil = player.invulnerableUntil;
      }

      if (game.phase === "intermission") {
        if (game.time >= game.intermissionUntil) {
          startBossBattle();
        } else {
          return;
        }
      }

      movePlayer(deltaTime);
      if (game.phase === "standard" || game.phase === "rush") {
        moveFormation(deltaTime);
      }
      if (game.gameOver || game.victory) {
        return;
      }

      if (game.phase === "boss") {
        updateBoss(deltaTime);
      } else {
        game.enemyFireCooldown -= deltaTime;
        const enemyFireInterval = game.phase === "rush" ? 0.3 : 1.5;
        if (game.enemyFireCooldown <= 0) {
          fireEnemyBullet();
          game.enemyFireCooldown = enemyFireInterval;
        }
      }

      updateBullets(deltaTime);
      if (game.phase === "rush" && livingInvaders().length === 0) {
        beginBossIntermission();
      }
    }

    function drawPlayer() {
      if (player.respawning) {
        return;
      }

      if (!game.devMode && game.time < player.flashUntil) {
        const colors = ["#ff2020", "#2080ff", "#39ff14"];
        const colorIndex = Math.floor((game.time - player.flashStartedAt) / 0.3) % colors.length;
        context.fillStyle = colors[colorIndex];
      } else if (!game.devMode && game.time < player.invulnerableUntil &&
        Math.floor(game.time * 12) % 2 === 0) {
        return;
      } else {
        context.fillStyle = "#39ff14";
      }
      context.beginPath();
      context.moveTo(player.x + player.width / 2, player.y);
      context.lineTo(player.x + player.width, player.y + player.height);
      context.lineTo(player.x, player.y + player.height);
      context.closePath();
      context.fill();
    }

    function drawInvaders() {
      const frameIndex = Math.floor(game.time / 0.35) % 2;
      for (const invader of invaders) {
        if (!invader.alive) {
          continue;
        }

        const sprite = spriteTypes[invader.type];
        const frame = sprite.frames[frameIndex];
        context.fillStyle = sprite.color;
        for (let row = 0; row < frame.length; row += 1) {
          for (let column = 0; column < frame[row].length; column += 1) {
            if (frame[row][column] === "1") {
              context.fillRect(
                invader.baseX + formation.offsetX + column * formation.spritePixelSize,
                invader.baseY + formation.offsetY + row * formation.spritePixelSize,
                formation.spritePixelSize,
                formation.spritePixelSize
              );
            }
          }
        }
      }
    }

    function drawBullets() {
      context.save();
      context.shadowColor = "#8ffcff";
      context.shadowBlur = 10;
      context.fillStyle = "#f4ffff";
      for (const bullet of playerBullets) {
        context.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
      }
      context.restore();

      for (const bullet of enemyBullets) {
        context.fillStyle = bullet.vy === undefined ? "#ff557a" : "#ffb347";
        context.shadowColor = bullet.vy === undefined ? "#ff557a" : "#ff8c2f";
        context.shadowBlur = bullet.vy === undefined ? 0 : 7;
        context.fillRect(bullet.x, bullet.y, bullet.width, bullet.height / 2);
        context.fillRect(
          bullet.x + 1,
          bullet.y + bullet.height / 2,
          bullet.width - 2,
          bullet.height / 2
        );
      }
      context.shadowBlur = 0;
    }

    function drawBoss() {
      if (game.phase !== "boss" && !game.victory) {
        return;
      }

      const pixelSize = boss.width / bigZimSprite[0].length;
      for (let row = 0; row < bigZimSprite.length; row += 1) {
        for (let column = 0; column < bigZimSprite[row].length; column += 1) {
          const pixel = bigZimSprite[row][column];
          if (pixel === "0") {
            continue;
          }
          context.fillStyle = pixel === "2" ? "#ff557a" : "#7dff5c";
          context.fillRect(
            boss.x + column * pixelSize,
            boss.y + row * pixelSize,
            pixelSize,
            pixelSize
          );
        }
      }
    }

    function drawBossHealth() {
      if (game.phase !== "boss") {
        return;
      }

      const barWidth = 360;
      const barX = (canvas.width - barWidth) / 2;
      context.textAlign = "center";
      context.textBaseline = "top";
      context.font = "bold 18px monospace";
      context.fillStyle = "#39ff14";
      context.shadowColor = "#39ff14";
      context.shadowBlur = 10;
      context.fillText("BIG ZIM", canvas.width / 2, 8);
      context.shadowBlur = 0;
      context.fillStyle = "#263326";
      context.fillRect(barX, 32, barWidth, 14);
      context.fillStyle = "#39ff14";
      context.fillRect(barX, 32, barWidth * boss.health / boss.maxHealth, 14);
      context.strokeStyle = "#b5ff9f";
      context.strokeRect(barX, 32, barWidth, 14);
    }

    function drawBunkers() {
      context.fillStyle = "#39ff14";
      for (const bunker of bunkers) {
        for (let row = 0; row < bunker.cells.length; row += 1) {
          for (let column = 0; column < bunker.cells[row].length; column += 1) {
            if (bunker.cells[row][column]) {
              context.fillRect(
                bunker.x + column * bunker.cellSize,
                bunker.y + row * bunker.cellSize,
                bunker.cellSize,
                bunker.cellSize
              );
            }
          }
        }
      }
    }

    function drawHud() {
      context.fillStyle = "#ffffff";
      context.font = "20px monospace";
      context.textBaseline = "top";
      context.textAlign = "left";
      context.fillText(`SCORE ${String(game.score).padStart(5, "0")}`, 22, 18);
      context.fillText("LIVES", canvas.width - 180, 18);

      for (let life = 0; life < game.lives; life += 1) {
        const x = canvas.width - 102 + life * 18;
        context.fillStyle = "#39ff14";
        context.beginPath();
        context.moveTo(x + 6, 18);
        context.lineTo(x + 12, 28);
        context.lineTo(x, 28);
        context.closePath();
        context.fill();
      }

      if (game.devMode) {
        context.fillStyle = "#39ff14";
        context.font = "bold 12px monospace";
        context.fillText("Dev Mode Enabled", canvas.width - 180, 46);
      }
    }

    function drawBossAlert() {
      if (game.phase !== "boss" || game.time >= game.bossAlertUntil ||
        Math.floor(game.time * 8) % 2 === 1) {
        return;
      }

      context.save();
      context.fillStyle = "rgba(0, 0, 0, 0.72)";
      context.fillRect(0, canvas.height / 2 - 42, canvas.width, 84);
      context.fillStyle = "#ff2020";
      context.font = "bold 38px monospace";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.shadowColor = "#ff0000";
      context.shadowBlur = 18;
      context.fillText("!! BOSS BATTLE !!", canvas.width / 2, canvas.height / 2);
      context.restore();
    }

    function drawRushAlert() {
      if (game.phase !== "rush" || game.time >= game.rushAlertUntil ||
        Math.floor(game.time * 8) % 2 === 1) {
        return;
      }

      context.save();
      context.fillStyle = "rgba(0, 0, 0, 0.72)";
      context.fillRect(0, canvas.height / 2 - 42, canvas.width, 84);
      context.fillStyle = "#ffd700";
      context.font = "bold 38px monospace";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.shadowColor = "#ffd700";
      context.shadowBlur = 18;
      context.fillText("!! RUSH MODE !!", canvas.width / 2, canvas.height / 2);
      context.restore();
    }

    function drawEndMessage() {
      if (!game.gameOver && !game.victory) {
        return;
      }

      context.fillStyle = "rgba(0, 0, 0, 0.78)";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = game.victory ? "#39ff14" : "#ff2020";
      context.font = "bold 42px monospace";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(game.victory ? "YOU WIN!" : "GAME OVER", canvas.width / 2, canvas.height / 2);
      context.fillStyle = "#ffffff";
      context.font = "20px monospace";
      context.fillText(
        `FINAL SCORE ${String(game.score).padStart(5, "0")}`,
        canvas.width / 2,
        canvas.height / 2 + 42
      );
      context.font = "bold 20px monospace";
      context.fillText(
        game.gameOver ? "Press R to Restart" : "Press R to Play Again",
        canvas.width / 2,
        canvas.height / 2 + 82
      );
    }

    function draw() {
      context.fillStyle = "#000000";
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawHud();
      drawInvaders();
      drawBoss();
      drawBossHealth();
      drawBunkers();
      drawBullets();
      drawPlayer();
      drawRushAlert();
      drawBossAlert();
      drawEndMessage();
    }

    function handleKey(event, isPressed) {
      if (isPressed && event.code === "KeyR" && (game.gameOver || game.victory)) {
        resetGame();
        event.preventDefault();
      } else if (event.code === "ArrowLeft") {
        keys.left = isPressed;
        event.preventDefault();
      } else if (event.code === "ArrowRight") {
        keys.right = isPressed;
        event.preventDefault();
      } else if (event.code === "ArrowUp") {
        keys.up = isPressed;
        event.preventDefault();
      } else if (event.code === "ArrowDown") {
        keys.down = isPressed;
        event.preventDefault();
      } else if (event.code === "Space") {
        keys.fire = isPressed;
        event.preventDefault();
      }
    }

    function trackKonamiCode(event) {
      if (event.repeat) {
        return;
      }
      if (event.code === konamiSequence[konamiIndex]) {
        konamiIndex += 1;
        if (konamiIndex === konamiSequence.length) {
          game.devMode = true;
          konamiIndex = 0;
        }
      } else {
        konamiIndex = event.code === konamiSequence[0] ? 1 : 0;
      }
    }

    window.addEventListener("keydown", (event) => {
      trackKonamiCode(event);
      if (
        event.code === "ArrowLeft" ||
        event.code === "ArrowRight" ||
        event.code === "ArrowUp" ||
        event.code === "ArrowDown" ||
        event.code === "Space"
      ) {
        getAudioContext();
      }
      handleKey(event, true);
    });
    window.addEventListener("keyup", (event) => handleKey(event, false));
    window.addEventListener("blur", () => {
      keys.left = false;
      keys.right = false;
      keys.up = false;
      keys.down = false;
      keys.fire = false;
    });

    let previousFrameTime = null;

    function gameLoop(timestamp) {
      const deltaTime = previousFrameTime === null
        ? 0
        : Math.min((timestamp - previousFrameTime) / 1000, 0.05);
      previousFrameTime = timestamp;

      update(deltaTime);
      draw();
      requestAnimationFrame(gameLoop);
    }

    draw();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
